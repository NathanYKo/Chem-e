name: Scrape ChemE jobs

on:
  schedule:
    - cron: "17 13 * * *" # daily, 13:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go run .
      - name: Verify published list
        run: go run . -verify
      - name: Commit refreshed list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md JOBS.md data/jobs.json data/jobs.csv
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update ChemE job list $(date -u +%F)"
            git push
          fi

